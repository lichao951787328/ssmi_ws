# Scenario-specific semantic palette. Gazebo label IDs are preserved exactly.
labels:
  "0": {semantic: background_unlabeled, rgb: [0, 0, 0]}
  "1": {semantic: dirt_trail,          rgb: [139, 90, 43]}
  "2": {semantic: grass,               rgb: [34, 139, 34]}
  "3": {semantic: gravel,              rgb: [190, 190, 170]}
  "4": {semantic: boundary,            rgb: [90, 90, 90]}
  "5": {semantic: bare_earth_slope,    rgb: [160, 110, 70]}
  "6": {semantic: dynamic_obstacle,    rgb: [255, 0, 255]}
  "7": {semantic: stairs,              rgb: [255, 165, 0]}
  "8": {semantic: natural_rock,        rgb: [105, 105, 105]}
  "9": {semantic: long_static,         rgb: [255, 80, 0]}
  "10": {semantic: rectangular_static, rgb: [0, 90, 255]}
  "11": {semantic: round_static,       rgb: [255, 220, 0]}
  "12": {semantic: vegetation,         rgb: [0, 170, 100]}
  "13": {semantic: maze_corridor_wall, rgb: [150, 75, 0]}

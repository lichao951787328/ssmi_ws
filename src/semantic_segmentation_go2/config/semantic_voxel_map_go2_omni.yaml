# Complete local3d_semantic_voxel_map configuration for the four-view cloud.
input_topic: /semantic_pcl/semantic_pcl
global_frame: world
use_initial_pose_reference: true
reference_frame: map_start
publish_local_cost_cloud: false
# Publish the filtered local snapshot (0.10 m XY, 0.05 m Z) in the robot body
# frame, frozen at the source cloud timestamp.
global_admission_output_frame: base_link
global_admission_exclude_dynamic: true
# The local voxel node performs the final common conversion for SSMI. Although
# Gazebo uses its own input palette, this output uses the same canonical
# encoding as the recorded /grids_points profile.
publish_ssmi_admitted_cloud: true
ssmi_admitted_topic: /semantic_pcl/global_admitted
ssmi_obstacle_traversability_threshold: 0.75
# The omni scenario intentionally contains gray moving objects mislabeled as
# static. Confirmed ray traversal of their old positions revokes the resulting
# SSMI trail; a missing/occluded voxel by itself remains inconclusive.
enable_ssmi_obstacle_revocation: true
ssmi_revocation_voxel_size: 0.10
ssmi_revocation_minimum_free_frames: 5
ssmi_revocation_minimum_free_duration: 0.5
ssmi_revocation_free_max_traversability: 0.45
ssmi_revocation_minimum_semantic_confidence: 0.60
ssmi_revocation_ray_evidence_enabled: true
ssmi_revocation_ray_endpoint_margin: 0.20
ssmi_revocation_ray_point_stride: 2
# The Gazebo semantic cloud has no traversability field. Infer non-traversable
# ground/stair boundaries from local terrain height discontinuities.
terrain_height_cost_enabled: true
terrain_height_difference_threshold: 0.15
# Compare only the 0.10 m grid's eight-neighbor columns. This catches a local
# ledge without turning cumulative height across several stair treads into one
# obstacle-sized discontinuity.
terrain_height_neighborhood_radius: 0.15
terrain_height_comparison_epsilon: 0.000001
terrain_height_obstacle_cost: 1.0
input_layout: image
point_stride: 1
semantic_field: semantic_color
confidence_field: semantic_confidence
cost_field: traversability
default_semantic_confidence: 1.0
transform_timeout: 0.2

# The merger concatenates four 480x270 images.  Reinterpret the flat buffer as
# a 480x1080 vertical stack and sample 120x270 = 32400 pixels per acquisition,
# which is close to the original single-camera processing load.
input_image_width: 480
input_image_height: 1080
pixel_stride_x: 4
pixel_stride_y: 4
pixel_offset_x: 2
pixel_offset_y: 2
timing_report_frames: 50

# Preserve 0.10 m XY planning cells but use 0.05 m vertically so a 0.10 m
# stair rise cannot be expanded to 0.20 m by center-of-voxel quantization.
voxel_size_xy: 0.10
voxel_size_z: 0.05
decay_seconds: 0.5
max_voxels: 500000
max_range: 15.0
min_z: -2.0
max_z: 4.0
local_radius: 20.0
local_box_enabled: false
# Exclude robot legs/body in base_link before voxel fusion and before terrain
# height-discontinuity inference. Rearward coverage is intentionally larger.
robot_body_exclusion_enabled: true
robot_body_exclusion_min_x: -0.5
robot_body_exclusion_max_x: 0.5
robot_body_exclusion_min_y: -0.3
robot_body_exclusion_max_y: 0.3

semantic_label_remap:
  - {from: "0x000000", to: 0}   # ground
  - {from: "0x808080", to: 2}   # static and false-static movers
  - {from: "0x0000ff", to: 3}   # low/static obstacle
  - {from: "0x98fb98", to: 9}   # grass and staircase terrain
  - {from: "0xff00ff", to: 11}  # true dynamic obstacle

semantic_positive_update: 1.0
semantic_negative_update: -0.1
semantic_min_log_evidence: -4.59512
semantic_max_log_evidence: 4.59512
semantic_new_class_prior: 0.8

unknown_cost: 0.50
semantic_cost_weight: 0.80
traversability_fusion_method: weighted_average
cost_rise_alpha: 0.65
cost_fall_alpha: 0.15

semantic_classes:
  - {label: 0,  name: ground,            color: [80, 180, 80],    cost: 0.05}
  - {label: 2,  name: static_obstacle,   color: [128, 128, 128],  cost: 0.95}
  - {label: 3,  name: static_structure,  color: [0, 0, 255],      cost: 0.85}
  - {label: 9,  name: terrain,           color: [152, 251, 152],  cost: 0.10}
  - {label: 11, name: dynamic_obstacle,  color: [255, 0, 255],    cost: 1.00}

publish_rate: 10.0
marker_alpha: 0.85
map_file: /tmp/local3d_semantic_voxel_map_omni.csv

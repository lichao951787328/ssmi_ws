# Shared semantic contract consumed by semantic_sensor_node.py and mapping nodes.
semantic_schema:
  version: 1
  input:
    label_field: semantic_lable
    traversability_field: traversability
  defaults:
    initial_floor_label: 1
  unknown:
    policy: exclude
    fallback_label: 13
    name: unknown
    meaning: invalid or unconfigured semantic input
    rgb: [127, 127, 127]
  traversability:
    override_semantics: true
    obstacle_threshold: 0.75
    obstacle_label: 13
  classes:
    - {label: 0,  name: background,       meaning: unlabeled or sky,           rgb: [0, 0, 0],       role: ignore,           global_map: false}
    - {label: 1,  name: flat_ground,      meaning: flat blue ground,           rgb: [70, 110, 180],  role: terrain,          global_map: true}
    - {label: 2,  name: grass,            meaning: grass terrain,              rgb: [34, 139, 34],   role: terrain,          global_map: true}
    - {label: 3,  name: gravel,           meaning: gravel terrain,             rgb: [190, 190, 170], role: terrain,          global_map: true}
    - {label: 4,  name: boundary,         meaning: boundary obstacle,          rgb: [90, 90, 90],    role: static_obstacle,  global_map: true}
    - {label: 5,  name: bare_earth_slope, meaning: heightmap earth terrain,    rgb: [160, 110, 70],  role: terrain,          global_map: true}
    - label: 6
      name: dynamic_obstacle
      meaning: movable obstacle
      rgb: [255, 0, 255]
      input_rgb_aliases: []
      role: dynamic_obstacle
      global_map: false
    - {label: 7,  name: stairs,           meaning: traversable staircase,      rgb: [255, 165, 0],   role: terrain,          global_map: true}
    - {label: 8,  name: natural_rock,     meaning: physical gravel stone,      rgb: [105, 105, 105], role: static_obstacle,  global_map: true}
    - {label: 9,  name: long_static,      meaning: long static obstacle,       rgb: [255, 80, 0],    role: static_obstacle,  global_map: true}
    - {label: 10, name: rectangular,      meaning: rectangular obstacle,       rgb: [0, 90, 255],    role: static_obstacle,  global_map: true}
    - {label: 11, name: round_static,     meaning: round static obstacle,      rgb: [255, 220, 0],   role: static_obstacle,  global_map: true}
    - {label: 12, name: vegetation,       meaning: pine or oak tree,           rgb: [0, 170, 100],   role: static_obstacle,  global_map: true}
    - {label: 13, name: maze_wall,        meaning: maze corridor wall,         rgb: [150, 75, 0],    role: static_obstacle,  global_map: true}

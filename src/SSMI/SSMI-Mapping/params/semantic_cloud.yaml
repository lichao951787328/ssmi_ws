# Camera intrinsic matrix parameters
camera:
  fx: 320
  fy: 320
  cx: 320
  cy: 240

  width: 640
  height: 480

semantic_pcl:
  color_image_topic: "/rgbd_camera/image"
  semantic_image_topic: "/semantic/colored_map"
  depth_image_topic: "/rgbd_camera/depth_image"
  point_type: 0
  frame_id: "camera_optic"
  depth_noise_std: 0.0
  true_class_prob: 1.0
  synchronization_slop: 0.02
  depth_edge_filter:
    enabled: true
    absolute_threshold: 0.15
    relative_threshold: 0.03
    reject_semantic_boundaries: true
  # Dynamic colors and aliases are read from /semantic_schema. For those
  # pixels, rgb and semantic_color are kept identical so camera texture cannot
  # hide the categorical semantic value.
  # set unit_conversion to 1000 if the depth image is in mm
  unit_conversion: 1.0

grid_semantic_adapter:
    # Legacy compatibility only. The local voxel node now performs this
    # conversion and publishes /semantic_pcl/global_admitted directly.
    input_topic: /local_3d_semantic_voxel_map/global_semantic_admission_grid
    output_topic: /semantic_pcl/global_admitted
    # Input field names, label/color mapping, unknown handling, and the
    # high-cost override all come from params/semantic_schema.yaml.

octomap:
    pointcloud_topic: /semantic_pcl/global_admitted
    world_frame_id: map_start
    use_initial_pose_reference: false
    reference_frame_id: map_start
    # A larger backward jump indicates rosbag restart and starts a new map.
    # Set below zero to disable automatic session reset.
    time_jump_reset_threshold: 1.0
    resolution: 0.1
    max_range: 15.0
    raycast_range: 15.0
    clamping_thres_min: 0.0001
    clamping_thres_max: 0.99
    occupancy_thres: 0.5
    prob_hit: 0.7
    prob_miss: 0.4
    dynamic_free_updates: 64
    dynamic_free_confirmations: 1
    psi: 1
    phi: -0.1
    publish_2d_map: true
    min_ground_z: 1.0
    max_ground_z: 3.5
    initialize_floor: false

    # The admission cloud is an already-fused local grid, not a raw scan.
    # Missing cells and dynamic occlusion are not free evidence. This inserts
    # only the endpoints selected by the upstream local filter.
    input_mode: local_grid
    enable_raycast_clearing: false

    # The local voxel node emits only multi-frame, positive free-space
    # contradictions. Missing local cells and dynamic occlusion are not events.
    enable_explicit_revocation: true
    revoked_free_topic: /local_3d_semantic_voxel_map/revoked_free
    revoked_reclassified_topic: /local_3d_semantic_voxel_map/revoked_reclassified

    # Semantic class admission and static-obstacle priority are read from the
    # shared /semantic_schema parameter; do not duplicate a palette here.
    save_path: /tmp/semantic_grid_map.ot
